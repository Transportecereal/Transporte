const C={bg:"#0f1117",surface:"#1a1d27",card:"#21253a",accent:"#f5a623",blue:"#4a9eff",green:"#2ecc71",red:"#e74c3c",purple:"#a78bfa",teal:"#2dd4bf",muted:"#6b7280",text:"#e8eaf0",border:"#2d3148"};

const fmt=n=>new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0}).format(n||0);
const fmtD=d=>{
  if(!d)return"-";
  try{
    const s=String(d);
    // Handle Google Sheets Date(year,month,day) format
    const match=s.match(/Date\((\d+),(\d+),(\d+)\)/);
    if(match){
      const[,y,m,day]=match;
      return`${String(day).padStart(2,'0')}/${String(+m+1).padStart(2,'0')}/${y}`;
    }
    // Handle YYYY-MM-DD format
    if(s.includes("-")){const[y,m,day]=s.split("-");return`${day}/${m}/${y}`;}
    return s;
  }catch{return String(d);}
};
const diasH=f=>!f?999:Math.ceil((new Date(f)-new Date())/86400000);
const hoy=()=>new Date().toISOString().split("T")[0];
const newId=()=>Date.now();

const fetchSheet=async(sheet)=>{
  try{
    const url=SCRIPT_URL+"?sheet="+encodeURIComponent(sheet)+"&t="+Date.now();
    const res=await fetch(url);
    const json=await res.json();
    if(!json.ok||!json.data)return[];
    return json.data.map(row=>{
      const obj={};
      Object.keys(row).forEach(k=>{
        const v=row[k];
        obj[k]=v!==null&&v!==undefined?String(v):"";
      });
      return obj;
    });
  }catch(e){console.error("Error:",sheet,e);return[];}
};


const saveRow=async(hoja,fila)=>{
  try{
    const res=await fetch(SCRIPT_URL,{
      method:"POST",
      headers:{"Content-Type":"text/plain"},
      body:JSON.stringify({hoja,fila})
    });
    const data=await res.json();
    return data.ok;
  }catch(e){
    console.error("Error guardando:",e);
    return false;
  }
};

  const [caja,setCaja]=useState(150000);
  if(loading)return React.createElement(Spin);
  const sueldos=EMPLEADOS_BASE.reduce((a,b)=>a+b.basico+b.aportes+b.uatre+b.art,0);
  const cuotBanco=prest.reduce((a,b)=>a+(+b.Cuota||0),0);
  const cuotSeguro=polizas.filter(p=>p.Estado==="Activa").reduce((a,b)=>a+(+b.Cuota||0),0);
  const impMes=impuestos.filter(x=>x.Periodicidad==="Mensual"&&x.Estado==="Pendiente").reduce((a,b)=>a+(+b.Monto||0),0);
  const honorarios=proveedores.filter(p=>p.Categoria==="Servicios Profesionales"&&p.Estado==="Pendiente").reduce((a,b)=>a+(+b.Monto||0),0);
  const gb=gastosBanc.reduce((a,b)=>a+(+b.Monto||0),0);
  const combustible=proveedores.filter(p=>p.Categoria==="Combustible").reduce((a,b)=>a+(+b.Monto||0),0)||250000;
  const rep=proveedores.filter(p=>p.Categoria==="Repuestos y Reparación").reduce((a,b)=>a+(+b.Monto||0),0)||85000;
  const totalMes=sueldos+cuotBanco+cuotSeguro+impMes+honorarios+gb+combustible+rep;
  const ingBase=viajes.length>0?viajes.reduce((a,b)=>a+(+b.Monto||0),0)/viajes.length:370000;
  const sems=(()=>{
    const gSem=(sueldos+combustible+rep)/4;
    let s=caja;
    return["Semana 1","Semana 2","Semana 3","Semana 4"].map((label,i)=>{
      const ing=i===0?ingBase*1.1:i===2?ingBase*0.85:ingBase;
      const banco=i===2?cuotBanco:0;
      const seg=i===1?cuotSeguro:0;
      const imp=i===2?impMes:0;
      const hon=i===3?honorarios:0;
      const eg=gSem+banco+seg+imp+hon+(i===0?gb:0);
      const neto=ing-eg;s+=neto;
      const venc=[].concat(banco>0?[`Banco: ${fmt(banco)}`]:[]).concat(seg>0?[`Seguro: ${fmt(seg)}`]:[]).concat(imp>0?[`Impuestos: ${fmt(imp)}`]:[]).concat(hon>0?[`Honorarios: ${fmt(hon)}`]:[]);
      return{label,ing,eg,neto,saldo:s,venc};
    });
  })();

          React.createElement("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:7}},React.createElement("span",{style:{color:C.text,fontWeight:800,fontSize:12}},s.label),React.createElement("span",{style:{fontSize:16}},st.icon)),
          React.createElement("div",{style:{marginBottom:5}},React.createElement("div",{style:{color:C.muted,fontSize:10,fontWeight:700}},"NECESITÁS"),React.createElement("div",{style:{color:C.red,fontWeight:800,fontSize:15}},fmt(s.eg))),
          React.createElement("div",{style:{marginBottom:5}},React.createElement("div",{style:{color:C.muted,fontSize:10,fontWeight:700}},"INGRESA"),React.createElement("div",{style:{color:C.green,fontWeight:800,fontSize:15}},fmt(s.ing))),

// ── REPORTE ──
const Reporte=({viajes,prest,polizas,impuestos,gastosBanc,proveedores,loading})=>{
  if(loading)return React.createElement(Spin);
  const sueldos=EMPLEADOS_BASE.reduce((a,b)=>a+b.basico+b.aportes+b.uatre+b.art,0);
  const cuotBanco=prest.reduce((a,b)=>a+(+b.Cuota||0),0);
  const cuotSeguro=polizas.filter(p=>p.Estado==="Activa").reduce((a,b)=>a+(+b.Cuota||0),0);
  const impMes=impuestos.filter(x=>x.Periodicidad==="Mensual").reduce((a,b)=>a+(+b.Monto||0),0);
  const honorarios=proveedores.filter(p=>p.Categoria==="Servicios Profesionales").reduce((a,b)=>a+(+b.Monto||0),0);
  const gb=gastosBanc.reduce((a,b)=>a+(+b.Monto||0),0);
  const combustible=proveedores.filter(p=>p.Categoria==="Combustible").reduce((a,b)=>a+(+b.Monto||0),0)||250000;
  const rep=proveedores.filter(p=>p.Categoria==="Repuestos y Reparación").reduce((a,b)=>a+(+b.Monto||0),0)||85000;
  const ingresos=viajes.reduce((a,b)=>a+(+b.Monto||0),0);
  const totalEg=sueldos+cuotBanco+cuotSeguro+impMes+honorarios+gb+combustible+rep;
  const res=ingresos-totalEg;
  const exportCSV=()=>{
    const rows=[["REPORTE TRANSPORTE CEREAL"],[""],["Ingresos viajes",ingresos],[""],["Sueldos+cargas",sueldos],["Combustible",combustible],["Repuestos",rep],["Cuotas prestamos",cuotBanco],["Cuotas seguros",cuotSeguro],["Impuestos",impMes],["Serv.Profesionales",honorarios],["Gastos bancarios",gb],[""],["TOTAL EGRESOS",totalEg],["RESULTADO NETO",res]];
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([rows.map(r=>r.join(",")).join("\n")],{type:"text/csv"}));
    a.download="reporte-transporte.csv";a.click();
  };
  const items=[{l:"▲ Viajes facturados",m:ingresos,c:C.green},{l:"▼ Sueldos+cargas",m:sueldos,c:C.red},{l:"▼ Combustible",m:combustible,c:C.red},{l:"▼ Repuestos/Reparación",m:rep,c:C.red},{l:"▼ Cuotas préstamos",m:cuotBanco,c:C.red},{l:"▼ Cuotas seguros",m:cuotSeguro,c:C.red},{l:"▼ Impuestos",m:impMes,c:C.red},{l:"▼ Serv. Profesionales",m:honorarios,c:C.red},{l:"▼ Gastos bancarios",m:gb,c:C.red}];
  return React.createElement("div",{className:"fade"},
    React.createElement("div",{style:{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap"}},
      React.createElement(Card,{label:"Ingresos",val:fmt(ingresos),color:C.green}),
      React.createElement(Card,{label:"Egresos",val:fmt(totalEg),color:C.red}),
      React.createElement(Card,{label:"Resultado",val:fmt(res),color:res>=0?C.green:C.red,sub:res>=0?"Superávit":"Déficit"}),
    ),
    React.createElement("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}},
      React.createElement("span",{style:{color:C.text,fontWeight:700}},"Estado de resultados"),
      React.createElement(Btn,{onClick:exportCSV},"⬇ Exportar CSV")
    ),
    React.createElement("div",{style:{background:C.card,border:`1px solid ${C.border}`,borderRadius:11,overflow:"hidden"}},
      items.map((x,i)=>React.createElement("div",{key:x.l,style:{display:"flex",justifyContent:"space-between",padding:"11px 16px",borderBottom:i<items.length-1?`1px solid ${C.border}`:"none"}},
        React.createElement("span",{style:{color:C.text,fontSize:13}},x.l),
        React.createElement("span",{style:{color:x.c,fontWeight:700,fontSize:13}},fmt(x.m))
      )),
      React.createElement("div",{style:{display:"flex",justifyContent:"space-between",padding:"14px 16px",background:C.surface}},
        React.createElement("span",{style:{color:C.text,fontWeight:800,fontSize:15}},"RESULTADO NETO"),
        React.createElement("span",{style:{color:res>=0?C.green:C.red,fontWeight:800,fontSize:18}},fmt(res))
      )
    )
  );
};

// ── APP ──
function App(){
  const [tab,setTab]=useState("cashflow");
  const [loading,setLoading]=useState(true);
  const [lastUpdate,setLastUpdate]=useState(null);
  const [toast,setToast]=useState(null);
  const [sheets,setSheets]=useState({viajes:[],proveedores:[],empleados:[],pagosEmp:[],prestamos:[],gastosBanc:[],polizas:[],impuestos:[]});

  const showToast=(msg,ok)=>{
    setToast({msg,ok});
    setTimeout(()=>setToast(null),3000);
  };

  const loadAll=useCallback(async()=>{
    setLoading(true);
    try{
      const[viajes,proveedores,empleados,pagosEmp,prestamos,gastosBanc,polizas,impuestos]=await Promise.all([
        fetchSheet("Viajes"),fetchSheet("Proveedores"),fetchSheet("Empleados"),
        fetchSheet("PagosEmpleados"),fetchSheet("Prestamos"),fetchSheet("GastosBancarios"),
        fetchSheet("Polizas"),fetchSheet("Impuestos")
      ]);
      setSheets({viajes,proveedores,empleados,pagosEmp,prestamos,gastosBanc,polizas,impuestos});
      setLastUpdate(new Date().toLocaleTimeString("es-AR"));
    }catch(e){console.error(e);}
    setLoading(false);
  },[]);

  useEffect(()=>{loadAll();},[loadAll]);

  const TABS=[{id:"cashflow",label:"💰 Cashflow"},{id:"viajes",label:"🚛 Viajes"},{id:"proveedores",label:"🧾 Proveedores"},{id:"empleados",label:"👷 Empleados"},{id:"bancos",label:"🏦 Bancos"},{id:"polizas",label:"🛡️ Pólizas"},{id:"impuestos",label:"📋 Impuestos"},{id:"reporte",label:"📊 Reporte"}];
  const p={loading,onReload:loadAll,showToast,...sheets,prest:sheets.prestamos,pagos:sheets.pagosEmp,gastosBanc:sheets.gastosBanc,proveedores:sheets.proveedores};

  return React.createElement("div",{style:{minHeight:"100vh",background:C.bg}},
    toast&&React.createElement(Toast,{msg:toast.msg,ok:toast.ok}),
    React.createElement("div",{style:{background:C.surface,borderBottom:`1px solid ${C.border}`,padding:"0 14px",position:"sticky",top:0,zIndex:50}},
      React.createElement("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",paddingTop:12}},
        React.createElement("div",null,
          React.createElement("div",{style:{color:C.accent,fontSize:9,fontWeight:700,letterSpacing:2,textTransform:"uppercase"}},"Transporte Cereal"),
          React.createElement("div",{style:{color:C.text,fontSize:17,fontWeight:800}},"Panel de Gestión")
        ),
        React.createElement("div",{style:{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:2}},
          React.createElement("button",{onClick:loadAll,style:{background:C.card,border:`1px solid ${C.border}`,color:C.muted,borderRadius:7,padding:"5px 10px",fontSize:10,fontWeight:700,cursor:"pointer"}},"↻ Actualizar"),
          lastUpdate&&React.createElement("div",{style:{fontSize:9,color:C.muted}},"Últ: "+lastUpdate)
        )
      ),
      React.createElement("div",{style:{display:"flex",gap:1,marginTop:10,overflowX:"auto"}},
        TABS.map(t=>React.createElement("button",{key:t.id,onClick:()=>setTab(t.id),style:{background:tab===t.id?C.accent:"none",color:tab===t.id?"#000":C.muted,border:"none",borderRadius:"6px 6px 0 0",padding:"7px 11px",fontWeight:700,fontSize:11,cursor:"pointer",whiteSpace:"nowrap",flexShrink:0}},t.label))
      )
    ),
    React.createElement("div",{style:{padding:14,maxWidth:1100,margin:"0 auto"}},
      tab==="cashflow"&&React.createElement(Cashflow,p),
      tab==="viajes"&&React.createElement(Viajes,p),
      tab==="proveedores"&&React.createElement(Proveedores,p),
      tab==="empleados"&&React.createElement(Empleados,{...p,data:sheets.empleados,pagos:sheets.pagosEmp}),
      tab==="bancos"&&React.createElement(Bancos,p),
      tab==="polizas"&&React.createElement(Polizas,p),
      tab==="impuestos"&&React.createElement(Impuestos,p),
      tab==="reporte"&&React.createElement(Reporte,p),
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
