<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Transporte">
<meta name="theme-color" content="#0f1117">
<title>Transporte Cereal — Panel de Gestión</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#0f1117;color:#e8eaf0;font-family:'DM Sans','Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent;}
  input,select,button{font-family:'DM Sans','Segoe UI',sans-serif;}
  ::-webkit-scrollbar{width:4px;height:4px;}
  ::-webkit-scrollbar-track{background:#1a1d27;}
  ::-webkit-scrollbar-thumb{background:#2d3148;border-radius:2px;}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .fade{animation:fadeIn 0.25s ease}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useCallback}=React;
const SHEET_ID="1-TaTflAtickKIw-DfiPukaIlksGU4gGkDGbnYOkq8TI";
const BASE=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=`;

const C={bg:"#0f1117",surface:"#1a1d27",card:"#21253a",accent:"#f5a623",blue:"#4a9eff",green:"#2ecc71",red:"#e74c3c",purple:"#a78bfa",teal:"#2dd4bf",muted:"#6b7280",text:"#e8eaf0",border:"#2d3148"};

const fmt=n=>new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0}).format(n||0);
const fmtD=d=>{if(!d)return"-";try{const[y,m,day]=String(d).split("-");return`${day}/${m}/${y}`;}catch{return d;}};
const diasH=f=>!f?999:Math.ceil((new Date(f)-new Date())/86400000);

const fetchSheet=async(sheet)=>{
  try{
    const res=await fetch(`${BASE}${encodeURIComponent(sheet)}`);
    const text=await res.text();
    const json=JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/)[1]);
    const cols=json.table.cols.map(c=>c.label);
    return(json.table.rows||[]).map(r=>{
      const obj={};
      cols.forEach((c,i)=>{const cell=r.c[i];obj[c]=cell?(cell.v!==null?cell.v:""):"";});
      return obj;
    });
  }catch(e){console.error("Error:",sheet,e);return[];}
};

const Bdg=({v})=>{
  const m={Pagado:["#1a3a2a",C.green],Cobrado:["#1a3a2a",C.green],Pendiente:["#3a2a1a",C.accent],Activa:["#1a3a2a",C.green],Cancelada:["#3a1a1a",C.red]};
  const[bg,c]=m[v]||m.Pendiente;
  return React.createElement("span",{style:{background:bg,color:c,padding:"3px 9px",borderRadius:20,fontSize:11,fontWeight:700}},v);
};

const Card=({label,val,sub,color})=>React.createElement("div",{style:{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:"16px 18px",flex:1,minWidth:130}},
  React.createElement("div",{style:{color:C.muted,fontSize:10,fontWeight:700,letterSpacing:1,textTransform:"uppercase",marginBottom:6}},label),
  React.createElement("div",{style:{color:color||C.text,fontSize:18,fontWeight:800,lineHeight:1.1}},val),
  sub&&React.createElement("div",{style:{color:C.muted,fontSize:11,marginTop:4}},sub)
);

const Spin=()=>React.createElement("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:60,gap:16}},
  React.createElement("div",{style:{width:36,height:36,border:`3px solid ${C.border}`,borderTop:`3px solid ${C.accent}`,borderRadius:"50%",animation:"spin 0.8s linear infinite"}}),
  React.createElement("div",{style:{color:C.muted,fontSize:13}},"Cargando datos...")
);

const Pop=({title,onClose,children})=>React.createElement("div",{style:{position:"fixed",inset:0,background:"rgba(0,0,0,0.82)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:999}},
  React.createElement("div",{style:{background:C.surface,border:`1px solid ${C.border}`,borderRadius:14,padding:24,width:"92%",maxWidth:480,maxHeight:"88vh",overflowY:"auto"}},
    React.createElement("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}},
      React.createElement("span",{style:{color:C.accent,fontWeight:800,fontSize:15}},title),
      React.createElement("button",{onClick:onClose,style:{background:"none",border:"none",color:C.muted,fontSize:22,cursor:"pointer"}},"×")
    ),
    children
  )
);

const Fi=({label,...p})=>React.createElement("div",{style:{marginBottom:11}},
  React.createElement("div",{style:{color:C.muted,fontSize:11,fontWeight:700,marginBottom:4}},label),
  React.createElement("input",{...p,style:{width:"100%",background:C.card,border:`1px solid ${C.border}`,borderRadius:7,padding:"8px 11px",color:C.text,fontSize:13,boxSizing:"border-box"}})
);

const Se=({label,opts,value,onChange})=>React.createElement("div",{style:{marginBottom:11}},
  React.createElement("div",{style:{color:C.muted,fontSize:11,fontWeight:700,marginBottom:4}},label),
  React.createElement("select",{value,onChange,style:{width:"100%",background:C.card,border:`1px solid ${C.border}`,borderRadius:7,padding:"8px 11px",color:C.text,fontSize:13}},
    opts.map(o=>React.createElement("option",{key:o},o))
  )
);

const Btn=({children,onClick,v="pri",sm,full})=>{
  const s={pri:{background:C.accent,color:"#000"},sec:{background:C.card,color:C.text,border:`1px solid ${C.border}`},ok:{background:"#1a3a2a",color:C.green,border:`1px solid ${C.green}`},del:{background:"#3a1a1a",color:C.red,border:`1px solid ${C.red}`}};
  return React.createElement("button",{onClick,style:{...s[v],border:"none",...s[v],borderRadius:7,padding:sm?"4px 10px":"8px 16px",fontWeight:700,fontSize:sm?11:13,cursor:"pointer",width:full?"100%":"auto"}},children);
};

const InfoSheet=({texto})=>React.createElement("div",{style:{background:"#1a2a3a",border:`1px solid ${C.blue}`,borderRadius:9,padding:"12px 14px",marginTop:14}},
  React.createElement("div",{style:{color:C.blue,fontWeight:700,fontSize:11,marginBottom:4}},"📋 Para agregar datos:"),
  React.createElement("div",{style:{color:C.muted,fontSize:12,lineHeight:1.7}},texto)

// ── VIAJES ──

  const [f,sf]=useState({Cliente:"",Descripcion:"",Monto:"",Fecha:"",Vencimiento:""});
  if(loading)return React.createElement(Spin);
  const totalF=data.reduce((a,b)=>a+(+b.Monto||0),0);
  const cobrado=data.filter(x=>x.Estado==="Cobrado").reduce((a,b)=>a+(+b.Monto||0),0);
  const pend=data.filter(x=>x.Estado==="Pendiente").reduce((a,b)=>a+(+b.Monto||0),0);
  return React.createElement("div",{className:"fade"},
    React.createElement("div",{style:{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap"}},
      React.createElement(Card,{label:"Total facturado",val:fmt(totalF)}),
      React.createElement(Card,{label:"Cobrado",val:fmt(cobrado),color:C.green}),
      React.createElement(Card,{label:"Por cobrar",val:fmt(pend),color:C.accent,sub:`${data.filter(x=>x.Estado==="Pendiente").length} viajes`}),
    ),
    React.createElement("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}},
      React.createElement("span",{style:{color:C.text,fontWeight:700}},"Viajes registrados"),
      React.createElement("div",{style:{display:"flex",gap:8}},
        React.createElement(Btn,{v:"sec",sm:true,onClick:onReload},"↻ Actualizar"),
        React.createElement(Btn,{onClick:()=>setM(true)},"+ Nuevo"),
      )
    ),
    React.createElement("div",{style:{background:C.card,borderRadius:11,border:`1px solid ${C.border}`,overflowX:"auto"}},
      React.createElement("table",{style:{width:"100%",borderCollapse:"collapse",minWidth:520}},
        React.createElement("thead",null,React.createElement("tr",{style:{borderBottom:`1px solid ${C.border}`}},
          ["Cliente","Descripción","Monto","Vencimiento","Estado"].map(h=>React.createElement("th",{key:h,style:{padding:"10px 12px",textAlign:"left",color:C.muted,fontSize:10,fontWeight:700,letterSpacing:1,textTransform:"uppercase"}},h))
        )),
        React.createElement("tbody",null,data.map((v,i)=>React.createElement("tr",{key:i,style:{borderBottom:i<data.length-1?`1px solid ${C.border}`:"none"}},
          React.createElement("td",{style:{padding:"10px 12px",color:C.text,fontWeight:700,fontSize:12}},v.Cliente),
          React.createElement("td",{style:{padding:"10px 12px",color:C.muted,fontSize:12}},v.Descripcion),
          React.createElement("td",{style:{padding:"10px 12px",color:C.accent,fontWeight:700,fontSize:12}},fmt(+v.Monto)),
          React.createElement("td",{style:{padding:"10px 12px",color:C.muted,fontSize:12}},fmtD(v.Vencimiento)),
          React.createElement("td",{style:{padding:"10px 12px"}},React.createElement(Bdg,{v:v.Estado})),
        )))
      )
    ),
    m&&React.createElement(Pop,{title:"Nuevo Viaje",onClose:()=>setM(false)},
      React.createElement("div",{style:{background:"#1a2a3a",border:`1px solid ${C.blue}`,borderRadius:8,padding:"11px 13px",marginBottom:14}},
        React.createElement("div",{style:{color:C.blue,fontWeight:700,fontSize:12,marginBottom:3}},"📋 Cómo cargar este viaje:"),
        React.createElement("div",{style:{color:C.muted,fontSize:12,lineHeight:1.6}},"Completá los datos acá abajo para ver el resumen, luego ingresalos en tu planilla Google Sheets → pestaña Viajes → nueva fila.")
      ),
      React.createElement(Fi,{label:"Cliente",value:f.Cliente,onChange:e=>sf({...f,Cliente:e.target.value}),placeholder:"Ej: Agro SA"}),
      React.createElement(Fi,{label:"Descripción",value:f.Descripcion,onChange:e=>sf({...f,Descripcion:e.target.value}),placeholder:"Ej: Soja Rosario→Bahía"}),
      React.createElement(Fi,{label:"Monto ($)",type:"number",value:f.Monto,onChange:e=>sf({...f,Monto:e.target.value})}),
      React.createElement(Fi,{label:"Fecha",type:"date",value:f.Fecha,onChange:e=>sf({...f,Fecha:e.target.value})}),
      React.createElement(Fi,{label:"Vencimiento cobro",type:"date",value:f.Vencimiento,onChange:e=>sf({...f,Vencimiento:e.target.value})}),
      f.Cliente&&f.Monto&&React.createElement("div",{style:{background:C.card,borderRadius:8,padding:"10px 12px",marginTop:4,marginBottom:12,border:`1px solid ${C.accent}`}},
        React.createElement("div",{style:{color:C.muted,fontSize:10,fontWeight:700,marginBottom:5}},"DATOS PARA COPIAR EN SHEETS:"),
        React.createElement("div",{style:{color:C.accent,fontSize:12,fontWeight:700,lineHeight:1.8}},[f.Cliente,f.Descripcion,f.Monto,f.Fecha,f.Vencimiento,"Pendiente"].join(" | "))
      ),
      React.createElement("div",{style:{display:"flex",justifyContent:"flex-end"}},React.createElement(Btn,{v:"sec",onClick:()=>setM(false)},"Cerrar"))
    )
  );
};

// ── PROVEEDORES ──
const Proveedores=({data,loading,onReload})=>{

  const CATS=["Combustible","Repuestos y Reparación","Servicios Profesionales","Otros"];

  const pend=data.filter(x=>x.Estado==="Pendiente").reduce((a,b)=>a+(+b.Monto||0),0);
  const pagado=data.filter(x=>x.Estado==="Pagado").reduce((a,b)=>a+(+b.Monto||0),0);
  return React.createElement("div",{className:"fade"},

      React.createElement(Card,{label:"Pendiente",val:fmt(pend),color:C.accent}),
      React.createElement(Card,{label:"Pagado",val:fmt(pagado),color:C.green}),
      React.createElement(Card,{label:"Facturas",val:data.length,sub:`${data.filter(x=>x.Estado==="Pendiente").length} pendientes`}),
    ),
    React.createElement("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,flexWrap:"wrap",gap:8}},
      React.createElement("div",{style:{display:"flex",gap:5,flexWrap:"wrap"}},
        ["Todas",...CATS].map(c=>React.createElement("button",{key:c,onClick:()=>setFiltro(c),style:{background:filtro===c?C.accent:"none",color:filtro===c?"#000":C.muted,border:`1px solid ${filtro===c?C.accent:C.border}`,borderRadius:20,padding:"4px 11px",fontSize:11,fontWeight:700,cursor:"pointer"}},c))
      ),
      React.createElement(Btn,{v:"sec",sm:true,onClick:onReload},"↻ Actualizar")
    ),
    React.createElement("div",{style:{background:C.card,borderRadius:11,border:`1px solid ${C.border}`,overflowX:"auto"}},
      React.createElement("table",{style:{width:"100%",borderCollapse:"collapse",minWidth:460}},
        React.createElement("thead",null,React.createElement("tr",{style:{borderBottom:`1px solid ${C.border}`}},
          ["Proveedor","Categoría","Monto","Fecha","Estado"].map(h=>React.createElement("th",{key:h,style:{padding:"10px 12px",textAlign:"left",color:C.muted,fontSize:10,fontWeight:700,letterSpacing:1,textTransform:"uppercase"}},h))
        )),
        React.createElement("tbody",null,vis.map((p,i)=>React.createElement("tr",{key:i,style:{borderBottom:i<vis.length-1?`1px solid ${C.border}`:"none"}},
          React.createElement("td",{style:{padding:"10px 12px",color:C.text,fontWeight:700,fontSize:12}},p.Nombre),
          React.createElement("td",{style:{padding:"10px 12px"}},React.createElement("span",{style:{background:"#1a1a2a",color:catC[p.Categoria]||C.muted,padding:"2px 8px",borderRadius:12,fontSize:11,fontWeight:700}},p.Categoria)),
          React.createElement("td",{style:{padding:"10px 12px",color:C.accent,fontWeight:700,fontSize:12}},fmt(+p.Monto)),
          React.createElement("td",{style:{padding:"10px 12px",color:C.muted,fontSize:12}},fmtD(p.Fecha)),
          React.createElement("td",{style:{padding:"10px 12px"}},React.createElement(Bdg,{v:p.Estado})),
        )))
      )
    ),
    React.createElement(InfoSheet,{texto:"Abrí Google Sheets → pestaña Proveedores → nueva fila con: Nombre, Categoría, Monto, Fecha, Estado. Luego tocá ↻ Actualizar."})
  );
};

// ── EMPLEADOS ──
const Empleados=({data,pagos,loading,onReload})=>{
  if(loading)return React.createElement(Spin);
  const totS=data.reduce((a,b)=>a+(+b.Basico||0),0);
  const totC=data.reduce((a,b)=>a+(+b.Aportes||0)+(+b.UATRE||0)+(+b.ART||0),0);
  const totE=pagos.filter(p=>p.Tipo==="Extra por viaje").reduce((a,b)=>a+(+b.Monto||0),0);
  return React.createElement("div",{className:"fade"},
    React.createElement("div",{style:{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap"}},
      React.createElement(Card,{label:"Sueldos",val:fmt(totS),color:C.accent}),
      React.createElement(Card,{label:"Cargas sociales",val:fmt(totC),color:C.purple,sub:"Aportes+UATRE+ART"}),
      React.createElement(Card,{label:"Extras",val:fmt(totE),color:C.teal}),
      React.createElement(Card,{label:"Costo total",val:fmt(totS+totC+totE)}),
    ),
    React.createElement("div",{style:{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap"}},

        return React.createElement("div",{key:i,style:{background:C.card,border:`1px solid ${C.border}`,borderRadius:11,padding:16,flex:1,minWidth:240}},
          React.createElement("div",{style:{color:C.text,fontWeight:800,marginBottom:3}},"👷 "+emp.Nombre),
          React.createElement("div",{style:{color:C.muted,fontSize:11,marginBottom:12}},emp.Camion),
          React.createElement("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}},
            React.createElement("div",null,React.createElement("div",{style:{color:C.muted,fontSize:10,fontWeight:700}},"BÁSICO"),React.createElement("div",{style:{color:C.accent,fontWeight:800}},fmt(+emp.Basico))),
            React.createElement("div",null,React.createElement("div",{style:{color:C.muted,fontSize:10,fontWeight:700}},"CARGAS"),React.createElement("div",{style:{color:C.purple,fontWeight:800}},fmt((+emp.Aportes)+(+emp.UATRE)+(+emp.ART)))),
            React.createElement("div",null,React.createElement("div",{style:{color:C.muted,fontSize:10,fontWeight:700}},"PAGADO MES"),React.createElement("div",{style:{color:C.green,fontWeight:800}},fmt(pagado))),
            React.createElement("div",null,React.createElement("div",{style:{color:C.muted,fontSize:10,fontWeight:700}},"BANCO"),React.createElement("div",{style:{color:C.text,fontSize:11}},emp.Banco)),

          )

      React.createElement("span",{style:{color:C.text,fontWeight:700}},"Historial de pagos"),
      React.createElement(Btn,{v:"sec",sm:true,onClick:onReload},"↻ Actualizar")
    ),
    React.createElement("div",{style:{background:C.card,borderRadius:11,border:`1px solid ${C.border}`,overflowX:"auto"}},
      React.createElement("table",{style:{width:"100%",borderCollapse:"collapse",minWidth:500}},
        React.createElement("thead",null,React.createElement("tr",{style:{borderBottom:`1px solid ${C.border}`}},
          ["Empleado","Tipo","Monto","Fecha","Medio","Estado"].map(h=>React.createElement("th",{key:h,style:{padding:"10px 12px",textAlign:"left",color:C.muted,fontSize:10,fontWeight:700,letterSpacing:1,textTransform:"uppercase"}},h))
        )),
        React.createElement("tbody",null,pagos.map((p,i)=>{
          const emp=data.find(e=>String(e.ID)===String(p.EmpleadoID));
          return React.createElement("tr",{key:i,style:{borderBottom:i<pagos.length-1?`1px solid ${C.border}`:"none"}},
            React.createElement("td",{style:{padding:"10px 12px",color:C.text,fontWeight:700,fontSize:12}},emp?.Nombre||"-"),
            React.createElement("td",{style:{padding:"10px 12px"}},React.createElement("span",{style:{background:p.Tipo==="Extra por viaje"?"#1a2a3a":"#1a1a2a",color:p.Tipo==="Extra por viaje"?C.teal:C.muted,padding:"2px 7px",borderRadius:12,fontSize:11,fontWeight:700}},p.Tipo)),
            React.createElement("td",{style:{padding:"10px 12px",color:C.accent,fontWeight:700,fontSize:12}},fmt(+p.Monto)),
            React.createElement("td",{style:{padding:"10px 12px",color:C.muted,fontSize:12}},fmtD(p.Fecha)),

            React.createElement("td",{style:{padding:"10px 12px"}},React.createElement(Bdg,{v:p.Estado})),

        }))

    React.createElement(InfoSheet,{texto:"Sheets → PagosEmpleados → nueva fila: EmpleadoID, Tipo, Monto, Fecha, Medio (Transferencia/Efectivo), Estado."})
  );
};

// ── BANCOS ──
const Bancos=({prest,gastos,loading,onReload})=>{
  if(loading)return React.createElement(Spin);
  const BANCOS=["Santander","Banco Nación"];
  return React.createElement("div",{className:"fade"},
    React.createElement("div",{style:{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap"}},
      React.createElement(Card,{label:"Deuda total",val:fmt(prest.reduce((a,b)=>a+(+b.Saldo||0),0)),color:C.red}),
      React.createElement(Card,{label:"Cuotas/mes",val:fmt(prest.reduce((a,b)=>a+(+b.Cuota||0),0)),color:C.accent}),
      React.createElement(Card,{label:"Gastos bancarios",val:fmt(gastos.reduce((a,b)=>a+(+b.Monto||0),0)),color:C.muted}),
    ),
    React.createElement("div",{style:{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap"}},
      BANCOS.map(banco=>{
        const pr=prest.filter(p=>p.Banco===banco);
        const gs=gastos.filter(g=>g.Banco===banco);
        return React.createElement("div",{key:banco,style:{background:C.card,border:`1px solid ${C.border}`,borderRadius:11,padding:16,flex:1,minWidth:240}},
          React.createElement("div",{style:{color:C.blue,fontWeight:800,fontSize:14,marginBottom:12}},"🏦 "+banco),
          React.createElement("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}},
            React.createElement("div",null,React.createElement("div",{style:{color:C.muted,fontSize:10,fontWeight:700}},"DEUDA"),React.createElement("div",{style:{color:C.red,fontWeight:800,fontSize:16}},fmt(pr.reduce((a,x)=>a+(+x.Saldo||0),0)))),
            React.createElement("div",null,React.createElement("div",{style:{color:C.muted,fontSize:10,fontWeight:700}},"CUOTA"),React.createElement("div",{style:{color:C.accent,fontWeight:800,fontSize:16}},fmt(pr.reduce((a,x)=>a+(+x.Cuota||0),0)))),

      React.createElement("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",paddingTop:12}},
        React.createElement("div",null,
          React.createElement("div",{style:{color:C.accent,fontSize:9,fontWeight:700,letterSpacing:2,textTransform:"uppercase"}},"Transporte Cereal"),
          React.createElement("div",{style:{color:C.text,fontSize:17,fontWeight:800}},"Panel de Gestión")
        ),
        React.createElement("div",{style:{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:2}},
          React.createElement("button",{onClick:loadAll,style:{background:C.card,border:`1px solid ${C.border}`,color:C.muted,borderRadius:7,padding:"5px 10px",fontSize:10,fontWeight:700,cursor:"pointer"}},"↻ Actualizar"),
          lastUpdate&&React.createElement("div",{style:{fontSize:9,color:C.muted}},"Últ: "+lastUpdate)
        )
      ),
      React.createElement("div",{style:{display:"flex",gap:1,marginTop:10,overflowX:"auto",paddingBottom:0}},
        TABS.map(t=>React.createElement("button",{key:t.id,onClick:()=>setTab(t.id),style:{background:tab===t.id?C.accent:"none",color:tab===t.id?"#000":C.muted,border:"none",borderRadius:"6px 6px 0 0",padding:"7px 11px",fontWeight:700,fontSize:11,cursor:"pointer",whiteSpace:"nowrap",flexShrink:0}},t.label))
      )
    ),
    React.createElement("div",{style:{padding:14,maxWidth:1100,margin:"0 auto"}},
      tab==="cashflow"&&React.createElement(Cashflow,{...p,gastosBanc:sheets.gastosBanc,proveedores:sheets.proveedores}),
      tab==="viajes"&&React.createElement(Viajes,{data:sheets.viajes,loading,onReload:loadAll}),
      tab==="proveedores"&&React.createElement(Proveedores,{data:sheets.proveedores,loading,onReload:loadAll}),
      tab==="empleados"&&React.createElement(Empleados,{data:sheets.empleados,pagos:sheets.pagosEmp,loading,onReload:loadAll}),
      tab==="bancos"&&React.createElement(Bancos,{prest:sheets.prestamos,gastos:sheets.gastosBanc,loading,onReload:loadAll}),
      tab==="polizas"&&React.createElement(Polizas,{data:sheets.polizas,loading,onReload:loadAll}),
      tab==="impuestos"&&React.createElement(Impuestos,{data:sheets.impuestos,loading,onReload:loadAll}),
      tab==="reporte"&&React.createElement(Reporte,{...p,gastosBanc:sheets.gastosBanc,proveedores:sheets.proveedores}),
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
